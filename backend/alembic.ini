[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# The URL is resolved in alembic/env.py from app.core.config, which reads the
# environment. It is intentionally NOT written here: a database password must
# never live in a tracked file.
sqlalchemy.url =

# Timestamped, reviewable migration filenames.
file_template = %%(rev)s_%%(slug)s

# Only these tables belong to the application schema. The knowledge base is
# owned by backend/migrations/*.sql and is never autogenerated.
include_object = include_object
include_schemas = false

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

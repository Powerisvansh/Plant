# ---------------------------------------------------------------------------
# PlantDoctor reverse proxy.
#
# Local development over the LAN uses plain HTTP on port 80. Put your TLS
# certificate in ../certs/ and uncomment the :443 server to enable HTTPS.
# For a public domain, also set SERVER_NAME to your hostname.
# ---------------------------------------------------------------------------

upstream plantdoctor_api {
    server api:8000 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

# Plain HTTP. Serves the API, and redirects to HTTPS once a certificate exists.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME challenge for later TLS issuance.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        limit_req zone=api_general burst=40 nodelay;

        proxy_pass         http://plantdoctor_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Connection        "";
        proxy_keepalive    Timeout 60s;

        # Uploads: give the API room to validate a 12 MiB image.
        client_max_body_size 16m;
        proxy_request_buffering on;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;

        proxy_hide_header Server;
        add_header X-Content-Type-Options nosniff always;
    }

    # Authentication endpoints get their own, much tighter budget.
    location /api/v1/auth/ {
        limit_req zone=api_auth burst=10 nodelay;

        proxy_pass         http://plantdoctor_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_hide_header Server;
    }

    # Image uploads.
    location /api/v1/diagnosis/ {
        limit_req zone=api_upload burst=6 nodelay;

        proxy_pass         http://plantdoctor_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        client_max_body_size 16m;
        proxy_read_timeout  120s;
        proxy_hide_header Server;
    }

    # Uploaded images are served by the API (it enforces authorisation) with a
    # private cache. Nothing here is world cacheable.
    location /media/ {
        proxy_pass         http://plantdoctor_api;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header Cache-Control "private, max-age=3600" always;
    }

    # Health probes bypass the limiter so a monitor cannot lock itself out.
    location = /health {
        proxy_pass       http://plantdoctor_api;
        access_log       off;
    }
    location = /health/database {
        proxy_pass       http://plantdoctor_api;
        access_log       off;
    }

    # API documentation. Restrict to the LAN if you expose this beyond it.
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass       http://plantdoctor_api;
        proxy_set_header Host $host;
    }
}


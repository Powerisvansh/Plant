user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not advertise the exact nginx version.
    server_tokens off;

    log_format json_combined escape=json
      '{"ts":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
      '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
      '"duration":$request_time,"ua":"$http_user_agent","ref":"$http_referer",'
      '"request_id":"$upstream_http_x_request_id"}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    client_max_body_size 16m;
    client_body_timeout 60s;
    client_header_timeout 20s;
    # The Authorization header must never reach an upstream log or error page.
    proxy_hide_header X-Powered-By;

    # Uploaded images are the largest legitimate body; the API applies the
    # stricter per-file limit and content validation.
    client_body_temp_path /var/cache/nginx/upload 1 2;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;

    # Rate-limit zones are declared here so they are shared by all workers.
    # Values are conservative; the application layer is the real authority.
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m     rate=1r/s;
    limit_req_zone $binary_remote_addr zone=api_upload:10m   rate=1r/s;

    include /etc/nginx/conf.d/*.conf;
}

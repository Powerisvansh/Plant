# =============================================================================
# PlantDoctor server stack.
#
#   cp .env.example .env            # then fill it in, or reuse the live file
#   docker compose --env-file /plantdoctor-data/.env up -d
#
# Two different files are involved, and the distinction matters:
#
#   --env-file  supplies *interpolation* variables (${...}) to Compose itself,
#               e.g. the database password used in the postgres service.
#   env_file:   passes the whole file into each container's environment.
#
# Interpolation does NOT read `env_file:`, which is the single most common
# reason `docker compose up` fails with "variable is not set".
#
# Data survives `docker compose down` because it lives in named volumes.
# `docker compose down -v` DELETES the database and every uploaded image.
#
# NOTE: the container publishes 127.0.0.1:5432. The host already runs its own
# PostgreSQL on 5432, so start Compose only after stopping the host cluster
# (or change this mapping) or the bind will fail.
# =============================================================================

name: plantdoctor

# Build context is the REPOSITORY ROOT: the image needs both backend/ and the
# operational scripts/ that live beside it.
x-build: &build
  context: ..
  dockerfile: backend/Dockerfile

x-api-env: &api-env
  # Inside the network the database is always the `postgres` service, never
  # 127.0.0.1. If the password contains URL-special characters, set
  # PLANTDOCTOR_DATABASE_URL explicitly and it wins over the value built here.
  DATABASE_URL: ${PLANTDOCTOR_DATABASE_URL:-postgresql+psycopg://${PLANTDOCTOR_DB_USER:-plantdoctor}:${PLANTDOCTOR_DB_PASSWORD:?set PLANTDOCTOR_DB_PASSWORD}@postgres:5432/${PLANTDOCTOR_DB_NAME:-plantdoctor}}
  TEST_DATABASE_URL: ${PLANTDOCTOR_TEST_DATABASE_URL:-postgresql+psycopg://${PLANTDOCTOR_DB_USER:-plantdoctor}:${PLANTDOCTOR_DB_PASSWORD:?set PLANTDOCTOR_DB_PASSWORD}@postgres:5432/plantdoctor_test}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
  OTP_HASH_PEPPER: ${OTP_HASH_PEPPER:?set OTP_HASH_PEPPER}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DEBUG: ${DEBUG:-false}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  # SMTP is optional in development; without it OTP mail is written to
  # /data/plantdoctor/mail as .eml files instead of being sent.
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
  REDIS_URL: ${REDIS_URL:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}

# One volume for the whole data root. Uploads, images, logs, mail and backups
# all live under /data/plantdoctor, so one named volume is enough; splitting it
# would let a backup outlive the data it was taken from.
x-api-volumes: &api-volumes
  - plantdoctor_data:/data/plantdoctor

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PLANTDOCTOR_DB_NAME:-plantdoctor}
      POSTGRES_USER: ${PLANTDOCTOR_DB_USER:-plantdoctor}
      POSTGRES_PASSWORD: ${PLANTDOCTOR_DB_PASSWORD:?set PLANTDOCTOR_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Bound to loopback on purpose: the database is never exposed to the LAN.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PLANTDOCTOR_DB_USER:-plantdoctor} -d ${PLANTDOCTOR_DB_NAME:-plantdoctor}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - log_min_duration_statement=2000
    stop_grace_period: 30s

  redis:
    <<: *restart
    image: redis:7-alpine
    # Optional. Disabled unless you pass --profile redis.
    profiles: ["redis"]
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 15s
      timeout: 5s
      retries: 5

  # One-shot: knowledge-base SQL first (it owns the plant/disease schema), then
  # Alembic for the application schema. Both are idempotent, so re-running is
  # safe. `api` waits for this to exit 0.
  migrate:
    build: *build
    image: plantdoctor/api:local
    <<: *restart
    restart: "no"
    env_file:
      - ${ENV_FILE:-.env}
    environment: *api-env
    volumes: *api-volumes
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python scripts/migrate.py up && alembic upgrade head && python -m app.cli seed-roles"

  api:
    build: *build
    image: plantdoctor/api:local
    <<: *restart
    env_file:
      - ${ENV_FILE:-.env}
    environment: *api-env
    volumes: *api-volumes
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      # 0.0.0.0 so a phone on the same Wi-Fi can reach http://DESKTOP_IP:8000
      - "${API_BIND:-0.0.0.0}:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 20s

  nginx:
    <<: *restart
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_started
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ops/nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 60s
      timeout: 5s
      retries: 3

  # Scheduled verified backups. Optional: --profile tools.
  backup:
    build: *build
    image: plantdoctor/api:local
    <<: *restart
    restart: "no"
    profiles: ["tools"]
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      <<: *api-env
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes: *api-volumes
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        while true; do
          echo "[backup] starting $(date -Iseconds)";
          python -m app.cli backup || echo "[backup] FAILED";
          sleep "$${BACKUP_INTERVAL_SECONDS:-86400}";
        done

volumes:
  postgres_data:
    name: plantdoctor_postgres_data
  redis_data:
    name: plantdoctor_redis_data
  plantdoctor_data:
    name: plantdoctor_data
  nginx_logs:
    name: plantdoctor_nginx_logs
